<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zara Browser Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="mark">Z</div>
    <h1>Zara Browser Bridge</h1>
    <p class="muted">Connect the Zara assistant to Chrome with explicit browser permissions.</p>
    <div id="status" class="status">Checking permissions…</div>
    <button id="grant" type="button">Grant website access</button>
    <p class="note">Website access is optional. It lets Zara read and scroll pages you select. Tab listing, opening and search use the tabs permission.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
